name: Update forecast ledger

# Locks a fresh day-ahead forecast into data/forecast_ledger.parquet BEFORE ISO-NE publishes
# the matching actuals, and scores rows whose actuals have since been published. The git commit
# timestamp is the proof each forecast predated its actual. Runs on GitHub's IP (Open-Meteo is
# not blocked there); needs ISO-NE Web Services credentials as repo secrets.

# NOTE: the daily schedule is disabled because ISO-NE Web Services returns 403 Forbidden to
# GitHub Actions' datacenter IPs (it allows the Streamlit Cloud app and normal home/office IPs,
# just not GitHub's runners). The forecast ledger must therefore be refreshed from an environment
# ISO-NE permits — see scripts/update_forecast_ledger.py. Kept as manual-only for testing.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-ledger
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: pip install -e .

      - name: Lock + score forecasts
        env:
          ISO_NE_WS_USER: ${{ secrets.ISO_NE_WS_USER }}
          ISO_NE_WS_PASS: ${{ secrets.ISO_NE_WS_PASS }}
        run: python scripts/update_forecast_ledger.py

      - name: Commit if changed
        run: |
          git config user.name "Arun Surendranath"
          git config user.email "53822804+arunnath011@users.noreply.github.com"
          if git diff --quiet -- data/forecast_ledger.parquet; then
            echo "No change in forecast ledger."
            exit 0
          fi
          git add data/forecast_ledger.parquet
          git commit -m "Update forecast ledger [skip ci]"
          # Another scheduled job may push to main concurrently; rebase and retry so a lost
          # push race doesn't fail the run. Only data/forecast_ledger.parquet changes here.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected; rebasing on latest main (attempt $attempt)…"
            git pull --rebase --autostash origin main || exit 1
          done
          echo "Failed to push after 5 attempts."
          exit 1
